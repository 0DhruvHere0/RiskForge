[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.12"
]
build-backend = "scikit_build_core.build"
[project]
name = "riskforge-analytics"
version = "0.1.0"
description = "Python interface for the RiskForge C++ engine"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "python-dotenv>=1.0"
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fastapi>=0.115,<0.116",
    "httpx>=0.27,<0.28",
    "anyio>=3.7,<4.0"
]
[tool.scikit-build]
cmake.source-dir = "."
wheel.packages = ["riskforge"]